version: '3.7'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes: 
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana.ini:/etc/grafana/grafana.ini
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=br(AI)yt
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: always

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    ports:
      - "9115:9115" # expose for Prometheus
    restart: always 
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: always

  calert:
    image: ghcr.io/mr-karan/calert:latest
    container_name: calert
    ports:
      - "6000:6000"
    command:
      - "--config=/app/config.toml"
    volumes:
      - ./calert-config.toml:/app/config.toml:ro
      - ./calert-template.tmpl:/app/template.tmpl:ro
    depends_on:
      - alertmanager
    restart: always

volumes:
  grafana-storage: